<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYM - Talk Your Mind | Anonymous Messages + Photos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TYM">
    <link rel="apple-touch-icon" href="./assets/tym-logo.png">
</head>
<body>
    <!-- Background Animation -->
    <div class="background" aria-hidden="true">
        <div class="gradient-bg"></div>
        <div class="blur-shapes shape1"></div>
        <div class="blur-shapes shape2"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">TYM</h1>
            <p class="subtitle">Talk Your Mind - Send anonymous messages with photos 📸</p>
        </header>

        <!-- Hero Section - Message Card -->
        <div class="card">
            <!-- User Profile Section -->
            <div class="profile-section">
                <div class="avatar-placeholder">
                    <img id="recipientAvatar" class="recipient-avatar" src="" alt="Recipient avatar">
                    <span id="recipientAvatarFallback" class="avatar-fallback" aria-hidden="true">👤</span>
                </div>
                <div class="profile-info">
                    <h2 class="username">Loading...</h2>
                    <p class="status">Please wait...</p>
                </div>
            </div>

            <!-- Message Input -->
            <div class="input-group">
                <label for="messageInput" class="sr-only">Your anonymous message</label>
                <textarea
                    id="messageInput"
                    class="message-textarea"
                    placeholder="Type your anonymous message here... Be nice! 💬"
                    maxlength="500"
                    aria-label="Your anonymous message"
                    aria-describedby="charCountGroup"
                ></textarea>
                <div class="char-count" id="charCountGroup" role="status" aria-live="polite">
                    <span id="charCount">0</span>/500
                </div>
            </div>

            <!-- Image Upload Section -->
            <div class="image-upload-section">
                <input
                    type="file"
                    id="imageInput"
                    class="file-input"
                    accept="image/*"
                    style="display: none;"
                    aria-label="Attach an image"
                >
                <button class="btn-add-image" id="addImageBtn" aria-label="Add an image to your message">
                    <span class="icon" aria-hidden="true">📸</span> Add Image
                </button>

                <!-- Image Preview -->
                <div id="imagePreview" class="image-preview hidden" role="region" aria-label="Image preview">
                    <div class="preview-content">
                        <img id="previewImg" src="" alt="Your attached image preview">
                        <button class="btn-remove-image" id="removeImageBtn" aria-label="Remove attached image">✕</button>
                    </div>
                    <p class="file-name" id="fileName"></p>
                </div>
            </div>

            <!-- Send Button -->
            <button class="btn-send" id="sendBtn" aria-label="Send anonymous message">
                <span>Send Message</span>
                <span class="arrow" aria-hidden="true">→</span>
            </button>

            <!-- Trust signal -->
            <p class="trust-line">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="13" height="13" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                100% anonymous — your identity is never revealed
            </p>
        </div>

        <!-- Get Your Own Link -->
        <div class="get-own-section">
            <button class="btn-get-link" onclick="window.location.href='./signup.html'">
                👇 Get your own link
            </button>
            <p class="get-own-text">Let your friends send you anonymous messages!</p>
        </div>

        <!-- Success Animation -->
        <div id="successMessage" class="success-message hidden" role="dialog" aria-modal="true" aria-label="Message sent successfully">
            <div class="success-content">
                <div class="success-icon" aria-hidden="true">🎉</div>
                <h2>Message Sent!</h2>
                <p>Your anonymous message has been delivered.</p>
                <div class="success-actions">
                    <button class="btn-send-another" onclick="closeSuccess()">Send Another</button>
                    <button class="btn-ok" onclick="closeSuccess()">Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
